<h3>Enter username or email</h3>
<button (click)="selectOption(0)">Username</button>
<button (click)="selectOption(1)">Email</button><br/>
@if(selectedOption == 0) {
    Username
    <div class="section">
        <input  type="text" [(ngModel)]="user.username">
    </div>
    <button (click)="usernameSubmit()">Submit</button>
}@else if(selectedOption == 1) {
    Email
    <div class="section">
        <input type="text" [(ngModel)]="user.email">
    </div>
    <button (click)="emailSubmit()">Submit</button>
}
<p style="color:red">{{message}}</p>
@if(submited) {
    <a [routerLink]="['/reset-password-link']">reset password</a><br/>
}
